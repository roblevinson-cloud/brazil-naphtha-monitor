name: Refresh naphtha data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: naphtha-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-data.txt
      - run: pip install -r requirements-data.txt
      - run: python scripts/update_data.py
      - name: Commit a changed snapshot
        run: |
          git config user.name "naphtha-monitor-bot"
          git config user.email "naphtha-monitor-bot@users.noreply.github.com"
          git add public/data/dashboard.json
          git diff --cached --quiet || git commit -m "data: refresh official sources"
          git push
